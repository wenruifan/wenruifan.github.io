name: Refresh Publications from Google Scholar

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scholar-publications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync Google Scholar profile
        env:
          GOOGLE_SCHOLAR_ID: 0O1EN4QAAAAJ
        run: python3 scripts/sync_scholar_publications.py

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'data: refresh publications from Google Scholar'
          title: 'Refresh publications from Google Scholar'
          body: |
            Automated weekly refresh of the publication index from Wenrui Fan's
            public Google Scholar profile.
          branch: automated/scholar-publications
          delete-branch: true
          labels: automated-pr, content, publications
